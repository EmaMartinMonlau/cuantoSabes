<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Main Page</title>
</head>
<body>
    <header>
        <a href="indexIngles.html" class="logo-container">
            <img id="logo" src="imagenes/logo.png" alt="Logo">
            <h2 id="titulo">CuantoSabes</h2>
        </a>   
        <a href="index.html" class="enlace-idioma">
            <img id="idioma" src="imagenes/idiomas.png" alt="Idioma">
            <span>Español</span>
        </a>
    </header>
    <main class="contenedor-principal">
        <h4 class="subtitulo">WELCOME TO THE ULTIMATE TRIVIA GAME!</h4>
        <h1>Test your mind with <span class="texto-amarillo">CuantoSabes</span></h1>
        <p class="texto-gris">How much do you know? Prove it!</p>
        
        <div class="tarjeta-login">
            <p>Your name or nickname</p>
            <input type="text" id="nickname" placeholder="E.g. Carlos">
            <button class="btn-neon" onclick="guardarYComenzar()">Start Game</button>
        </div>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
