<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Game</title>
</head>
<body>
    <header>
        <a href="indexIngles.html" class="logo-container">
            <img id="logo" src="imagenes/logo.png" alt="Logo">
            <h2>CuantoSabes</h2>
        </a>
        <div class="header-derecha">
            <p class="info-jugador">Player: <span id="display-jugador"></span></p>   
            <a href="preguntas.html" class="enlace-idioma">
                <img id="idioma" src="imagenes/idiomas.png" alt="Idioma">
                <span>Español</span>
            </a>
        </div>
    </header>
    <main class="contenedor-juego">
        <div id="contenedor-preguntas"></div>
        <button id="btn-comprobar" class="btn-neon" onclick="comprobarRespuestas()">Check answers</button>
    </main>

    <div id="modal-resultados" class="oculto">
        <div class="contenido-modal">
            <h2 id="mensaje-final"></h2>
            <p class="texto-gris">FINAL SCORE</p>
            <h3 id="puntuacion-final" class="texto-amarillo"></h3>
            <button class="btn-neon" onclick="window.location.href='indexIngles.html'">Play Again</button>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
